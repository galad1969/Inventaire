<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Inventaire Privé - Redirection</title>
    <script>
      // Redirection automatique GitHub Pages pour Single Page Application
      (function() {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // Détecter le premier segment de chemin (nom du dépôt GitHub s'il existe)
        var segments = path.split('/').filter(Boolean);
        var repo = segments.length > 0 ? '/' + segments[0] + '/' : '/';

        // Rediriger vers l'accueil du dépôt avec le hash approprié
        window.location.replace(repo + search + hash);
      })();
    </script>
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f5f5f7; color: #1d1d1f;">
    <p style="font-size: 14px; color: #6e6e73;">Chargement d'Inventaire Privé...</p>
  </body>
</html>
